[project]
name = "comfyui-nafnet-plus"
version = "1.1.0"
description = "Image restoration nodes for ComfyUI: NAFNet, SCUNet, Restormer, SwinIR, Real-ESRGAN, BSRGAN, HINet, MIRNet-v2, DnCNN and FFDNet denoising, deblurring and upscaling. Great for astrophotography. Models download automatically on first use."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "marduk191" }]
keywords = ["comfyui", "nafnet", "scunet", "restormer", "swinir", "real-esrgan", "image-restoration", "denoising", "deblurring", "super-resolution", "astrophotography"]
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
# torch, torchvision and numpy are provided by ComfyUI itself
dependencies = [
    "einops",
    "gdown",
]

[project.urls]
Repository = "https://github.com/marduk191/ComfyUI-NAFNet_plus"
"Bug Tracker" = "https://github.com/marduk191/ComfyUI-NAFNet_plus/issues"

[tool.comfy]
PublisherId = "marduk191"
DisplayName = "ComfyUI-NAFNet_plus"
Icon = ""
includes = []

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
